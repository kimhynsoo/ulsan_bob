<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>교직원식당 식단표</title>
<style>
  :root { --teal: #0EA2A4; --lime: #ABCD05; }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    padding: 14px;
    margin: 0;
    background: #f4f6f5;
    color: #222;
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: linear-gradient(135deg, var(--teal), var(--lime));
    border-radius: 14px;
    padding: 14px 10px;
    box-shadow: 0 4px 14px rgba(14, 162, 164, 0.28);
  }
  .nav button {
    width: 32px;
    height: 32px;
    flex: 0 0 auto;
    font-size: 15px;
    line-height: 1;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.28);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .nav button:hover { background: rgba(255, 255, 255, 0.45); }
  .nav button:active { transform: scale(0.92); }
  .nav button:disabled { background: rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.5); cursor: default; }
  .title { text-align: center; color: #fff; min-height: 30px; }
  #day { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  #date { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  #status {
    text-align: center;
    color: #888;
    padding: 28px 10px;
    margin-top: 12px;
    background: #fff;
    border-radius: 12px;
    font-size: 13px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
  }
  #status:empty { display: none; }
  #tabs {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  #tabs:empty { display: none; }
  #tabs button {
    flex: 1;
    padding: 8px 6px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #888;
    background: #fff;
    border: 1px solid #e3e6e5;
    border-radius: 10px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  #tabs button:hover { color: #333; }
  #tabs button.on {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(135deg, var(--teal), var(--lime));
  }
  #menu {
    list-style: none;
    padding: 4px 4px;
    margin: 12px 0 0;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }
  #menu:empty { display: none; }
  #menu li {
    position: relative;
    padding: 9px 10px 9px 22px;
    font-size: 14px;
    line-height: 1.4;
    border-bottom: 1px solid #f0f0f0;
  }
  #menu li::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 15px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal), var(--lime));
  }
  #menu li:last-child { border-bottom: none; }
  #menu li.rice::before { background: #E8A33D; }
  #menu li.soup::before { background: #4A90D9; }
  #menu li.main::before { background: #E0533D; }
  #menu li.main { font-weight: 700; }
  #menu li.side::before { background: #c4c9c6; }
  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 12px;
  }
  .footer .sep { color: #ccc; font-size: 12px; }
  .footer-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    color: #888;
    font-size: 12px;
    text-decoration: none;
    border-radius: 8px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .footer-link:hover { color: #333; background: rgba(0, 0, 0, 0.04); }
  .footer-link svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
<body>
  <div class="nav">
    <button id="prevBtn" aria-label="이전 날">◀</button>
    <div class="title">
      <div id="day"></div>
      <div id="date"></div>
    </div>
    <button id="nextBtn" aria-label="다음 날">▶</button>
  </div>
  <div id="tabs"></div>
  <div id="status">불러오는 중...</div>
  <ul id="menu"></ul>
  <div class="footer">
    <a class="footer-link" href="https://github.com/kimhynsoo/ulsan_bob" target="_blank" rel="noopener">

      GitHub

    <span class="sep">·</span>

  </div>

</body>
